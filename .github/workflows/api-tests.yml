name: API tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-e2e:
    name: Authentication and RBAC on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seremoto
          POSTGRES_PASSWORD: seremoto
          POSTGRES_DB: seremoto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seremoto -d seremoto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      SMS_PROVIDER: log
      DATABASE_URL: postgresql://seremoto:seremoto@localhost:5432/seremoto_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Throwaway signing keys for this job only. They are generated here rather
      # than stored as repository secrets so no credential is ever committed or
      # shared, and the environment contract still refuses to boot without them.
      - name: Provision one-time signing keys
        run: |
          echo "JWT_ACCESS_SECRET=$(node -e 'console.log(require("node:crypto").randomBytes(32).toString("hex"))')" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=$(node -e 'console.log(require("node:crypto").randomBytes(32).toString("hex"))')" >> "$GITHUB_ENV"

      - name: Check the committed migration matches the schema
        run: pnpm run db:check-migration

      # Captured rather than streamed so a failure can be reported with the
      # offending lines. Run summaries and annotations are readable without
      # repository sign-in; the raw step log is not.
      - name: Apply migrations
        id: deploy
        run: |
          set +e
          pnpm run prisma:migrate:deploy > /tmp/deploy.log 2>&1
          status=$?
          set -e
          {
            echo "### prisma migrate deploy (exit $status)"
            echo ""
            echo '```'
            tail -n 40 /tmp/deploy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            reason=$(grep -m 1 -E '^Error:|P[0-9]{4}|error:' /tmp/deploy.log || tail -n 1 /tmp/deploy.log)
            reason=$(printf '%s' "$reason" | tr -d '\r\n' | sed 's/%/%25/g' | cut -c 1-400)
            echo "::error::Migration failed — $reason"
            exit "$status"
          fi

      # Only runs when the migration is rejected. Replays the committed SQL with
      # ON_ERROR_STOP so the annotation names the statement and line PostgreSQL
      # refused, which the migration log alone does not show.
      - name: Locate the rejected statement
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          container=$(docker ps --format '{{.ID}} {{.Image}}' | awk '/postgres/ {print $1; exit}')
          if [ -z "$container" ]; then
            echo "::error::No PostgreSQL service container found to replay against."
            exit 0
          fi
          docker cp prisma/migrations/0_init/migration.sql "$container":/tmp/replay.sql
          docker exec "$container" psql -U seremoto -d seremoto_test -q -v ON_ERROR_STOP=1 -e \
            -f /tmp/replay.sql > /tmp/replay.log 2>&1 || true
          {
            echo '```'
            grep -n -A 2 -E 'ERROR:' /tmp/replay.log | head -n 25 || echo "Replay reported no errors."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm the schema is fully applied
        run: pnpm exec prisma migrate status --schema prisma/schema.prisma

      - name: Seed development accounts
        run: pnpm run db:seed

      - name: Run the authentication end-to-end suite
        run: pnpm turbo test:e2e --filter=@seremoto/api
